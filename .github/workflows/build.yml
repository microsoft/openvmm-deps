name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Preserve the release series used by the existing publishing workflow.
  # Increment this prefix only when intentionally starting a new series.
  RELEASE_VERSION_PREFIX: "0.3.0"

jobs:
  cgmanifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify cgmanifest.json is in sync with Dockerfile
        run: python3 pkg/Tools/gen-cgmanifest.py --check

  build:
    strategy:
      fail-fast: false
      matrix:
        architecture: [aarch64, x86_64]
    runs-on:
      - self-hosted
      - 1ES.Pool=openvmm-deps-gh-amd-westus2
      - 1ES.ImageOverride=ubuntu2404-amd64-docker
      - JobId=build-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up QEMU
        if: matrix.architecture == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.architecture }} packages
        run: |
          VERSION="$RELEASE_VERSION_PREFIX-$GITHUB_RUN_NUMBER"
          target=packages-x86_64
          if [ "${{ matrix.architecture }}" = "aarch64" ]; then
            target=packages-aarch64
          fi
          docker buildx build \
            --platform "${{ matrix.architecture }}" \
            --target "$target" \
            --build-arg VERSION="$VERSION" \
            --output type=local,dest=out \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.architecture }}
          path: out

  build-virtio-win:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build virtio-win package
        run: |
          VERSION="$RELEASE_VERSION_PREFIX-$GITHUB_RUN_NUMBER"
          docker buildx build \
            -f Dockerfile.virtio-win \
            --target packages \
            --build-arg VERSION="$VERSION" \
            --output type=local,dest=out \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtio-win
          path: out

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, build-virtio-win]
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: out

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$RELEASE_VERSION_PREFIX-$GITHUB_RUN_NUMBER"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY" \
            out/*/*.tar.gz
