name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Preserve the existing 0.3.0 release series. Increment only when
  # intentionally starting a new series.
  VERSION: "0.3.0-${{ github.run_number }}"

jobs:
  cgmanifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Verify cgmanifest.json is in sync with Dockerfile
        run: python3 pkg/Tools/gen-cgmanifest.py --check

  build:
    strategy:
      fail-fast: false
      matrix:
        architecture: [aarch64, x86_64]
    runs-on:
      - self-hosted
      - 1ES.Pool=openvmm-deps-gh-amd-westus2
      - 1ES.ImageOverride=ubuntu2404-amd64-docker
      - JobId=build-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Set up QEMU
        if: matrix.architecture == 'aarch64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build ${{ matrix.architecture }} packages
        run: |
          target=packages-x86_64
          if [ "${{ matrix.architecture }}" = "aarch64" ]; then
            target=packages-aarch64
          fi
          docker buildx build \
            --platform "${{ matrix.architecture }}" \
            --target "$target" \
            --build-arg VERSION="$VERSION" \
            --output type=local,dest=out \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.architecture }}
          path: out

  build-virtio-win:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build virtio-win package
        run: |
          docker buildx build \
            -f Dockerfile.virtio-win \
            --target packages \
            --build-arg VERSION="$VERSION" \
            --output type=local,dest=out \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virtio-win
          path: out

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, build-virtio-win]
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY" \
            out/*/*.tar.gz
